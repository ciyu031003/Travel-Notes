<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>甜途</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #151a21;
        --panel: #1f2833;
        --text: #e8e6e1;
        --muted: #9ba3ae;
        --accent: #e8b8c2;
        --rose: #a64e61;
        --border: rgba(232, 221, 216, 0.18);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Noto Serif SC", "Songti SC", "PingFang SC", serif;
        background: radial-gradient(circle at 50% 12%, #2c343e 0%, var(--bg) 58%);
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(31, 40, 51, 0.72);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .brand {
        text-align: center;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: 0.12em;
        color: var(--accent);
      }
      .subtitle {
        margin-top: 10px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.06em;
      }
      .section { margin-top: 26px; }
      .label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      input[type="url"], input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font-size: 15px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }
      .btn {
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: var(--rose);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .current {
        display: none;
        padding: 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid var(--border);
      }
      .current .url {
        display: block;
        margin-top: 6px;
        color: var(--accent);
        word-break: break-all;
        font-size: 14px;
      }
      .error {
        display: none;
        margin-top: 10px;
        color: #ffb4a2;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">甜途</div>
      <div class="subtitle">两个人的旅行与共同回忆</div>

      <section id="currentSection" class="section current">
        <div class="label">当前服务器地址</div>
        <div class="url" id="currentUrl"></div>
        <button class="btn" id="enterBtn" type="button">进入甜途</button>
        <button class="btn secondary" id="editBtn" type="button">修改服务器地址</button>
      </section>

      <section id="formSection" class="section">
        <label class="label" for="serverUrl">服务器地址</label>
        <input
          id="serverUrl"
          type="text"
          inputmode="url"
          autocomplete="url"
          placeholder="https://你的域名 或 http://192.168.1.100:3000"
        />
        <div class="hint">
          示例：局域网调试填 <span id="lanExample">http://192.168.1.100:3000</span><br />
          正式服务器填 <span id="httpsExample">https://travel.example.com</span>
        </div>
        <button class="btn" id="saveBtn" type="button">保存并进入</button>
        <button class="btn secondary" id="clearBtn" type="button" style="display:none">清除已保存地址</button>
        <div class="error" id="errorText">请输入有效的服务器地址</div>
      </section>
    </main>

    <script>
      const STORAGE_KEY = 'tiantu_server_url';
      const currentSection = document.getElementById('currentSection');
      const formSection = document.getElementById('formSection');
      const currentUrl = document.getElementById('currentUrl');
      const serverUrl = document.getElementById('serverUrl');
      const enterBtn = document.getElementById('enterBtn');
      const editBtn = document.getElementById('editBtn');
      const saveBtn = document.getElementById('saveBtn');
      const clearBtn = document.getElementById('clearBtn');
      const errorText = document.getElementById('errorText');

      function normalizeUrl(raw) {
        let s = (raw || '').trim();
        if (!s) return '';
        if (!/^https?:///i.test(s)) {
          if (
            /^(localhost|127.|0.0.0.0)/i.test(s) ||
            /^10./.test(s) ||
            /^192.168./.test(s) ||
            /^172.(1[6-9]|2[0-9]|3[0-1])./.test(s)
          ) {
            s = 'http://' + s;
          } else {
            s = 'https://' + s;
          }
        }
        return s.replace(//+$/, '');
      }

      function showForm(showClear) {
        currentSection.style.display = 'none';
        formSection.style.display = 'block';
        clearBtn.style.display = showClear ? 'block' : 'none';
        errorText.style.display = 'none';
      }

      function showCurrent(url) {
        currentUrl.textContent = url;
        currentSection.style.display = 'block';
        formSection.style.display = 'none';
        errorText.style.display = 'none';
      }

      function enterServer(url) {
        if (!url) return;
        // 使用 href 保留本地配置页在历史记录中，方便返回修改地址
        window.location.href = url;
      }

      function saveAndEnter() {
        const url = normalizeUrl(serverUrl.value);
        if (!url) {
          errorText.style.display = 'block';
          return;
        }
        localStorage.setItem(STORAGE_KEY, url);
        enterServer(url);
      }

      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        showCurrent(saved);
      } else {
        showForm(false);
      }

      enterBtn.addEventListener('click', function () {
        enterServer(localStorage.getItem(STORAGE_KEY));
      });

      editBtn.addEventListener('click', function () {
        serverUrl.value = localStorage.getItem(STORAGE_KEY) || '';
        showForm(true);
      });

      saveBtn.addEventListener('click', saveAndEnter);
      serverUrl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') saveAndEnter();
      });

      clearBtn.addEventListener('click', function () {
        localStorage.removeItem(STORAGE_KEY);
        serverUrl.value = '';
        showForm(false);
      });
    </script>
  </body>
</html>
