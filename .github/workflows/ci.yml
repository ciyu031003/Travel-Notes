name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  # 静态门禁 + 单测 + 构建：PR 上必须全绿才能合并
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_notes_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_notes_ci
      # P0-8：migrate diff --from-migrations 的影子库（与 DATABASE_URL 不同库，避免互相污染）；
      # 由下面 "Create shadow database" 步骤创建，prisma.config.ts 的 datasource.shadowDatabaseUrl 读取它。
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_notes_shadow
      # next build 阶段 NODE_ENV=production，lib/jwt-secret.ts 会拒绝缺失/占位/弱密钥；
      # CI 不需要真实密钥（只构建、不签发会话），用足够长且不含占位词的构建专用值。
      JWT_SECRET: ci-build-only-secret-0123456789abcdef
      SESSION_SECRET: ci-build-only-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # P1-25：lint 从「0 error 即通过」改成 warning 预算。
      # 486 = 2026-10-18 P0 阶段实测存量（0 errors / 486 warnings），只许下调：
      # 清掉一批就同步改小（建议每两周 -30），最终目标 --max-warnings=0。
      # 只允许调小，不允许为了「变绿」调大预算。
      - name: Lint (warning budget)
        run: npm run lint -- --max-warnings=486

      - name: Type check
        run: npm run typecheck

      # P1-25：带覆盖率跑单测，阈值在 vitest.config.mts（新增 @vitest/coverage-v8）
      - name: Unit & security tests (coverage)
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # CI 的 npm ci 不会执行被 allow-scripts 拦截的 postinstall，显式生成一次 Prisma Client
      - name: Prepare Prisma Client
        run: npx prisma generate

      # P0-8：schema 变更只走 Prisma Migrate（prisma/migrations/ 为唯一真相），不再 db push。
      - name: Apply database migrations
        run: npx prisma migrate deploy

      # P0-8 drift 门禁：把 prisma/migrations 重放到影子库后，结果必须与 schema.prisma 完全一致。
      # Prisma 7 的 --exit-code 语义：0 = 无漂移，2 = 有漂移（红灯），1 = 命令本身出错。
      # 任一非 0 都让 CI 失败；下面先建影子库（root 有建库权限），避免依赖 mysql 客户端。
      - name: Create shadow database for drift gate
        run: >-
          node -e "const mysql=require('mysql2/promise');(async()=>{const c=await mysql.createConnection('mysql://root:root@127.0.0.1:3306/');await c.query('CREATE DATABASE IF NOT EXISTS travel_notes_shadow');await c.end()})()"

      - name: Migration drift gate
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Build
        run: npm run build

      # 1.21.0：设计规范进 CI。
      # 门禁用「基线回归」（只拦新增违规）而不是 --strict（存量 439 处，直接 strict 等于永久红灯），
      # 收敛一批后用 npm run tokens -- --update-baseline 收紧基线。
      - name: Design tokens (baseline gate)
        run: npm run tokens:check

      # 报告模式：给出存量欠债的全貌，便于分批收敛（不阻塞）
      - name: Design token report
        run: npm run tokens

      # P1-25：不再用「|| true 报告模式」。high/critical 必须命中 scripts/audit-allowlist.json
      # 里未过期的豁免，否则红灯；未豁免/过期条目会在日志里逐条列出。
      - name: Dependency audit (allowlist gate)
        run: npm run audit:gate

  # P1-25：E2E 冒烟进 CI。只跑「不依赖种子数据」的用例：
  # - browse：9 个核心页的崩溃/横向溢出/关键文案冒烟
  # - home-aggregate：移动端首页只挂一层 + /api/home 聚合契约
  # - mobile-drawer：抽屉焦点圈定/inert/返回键/安全区
  # - auth：登录 → 进应用 → 退出
  # - session-expired：会话失效不再永久转圈（真机 bug 回归）
  # 刻意不跑：a11y.spec.ts（已有 9 条基线失败，等 UI 侧修复后单独开 job）；
  # ota-live.spec.ts（依赖真实外网与 App 包）；circle/album/travel-*（依赖已发布内容或会写数据）。
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: ci

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_notes_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_notes_ci
      # P0-8：与 ci job 保持一致（本 job 不跑 drift diff，但环境变量统一，便于排查）
      SHADOW_DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_notes_shadow
      # E2E 只在本机跑，密钥只求可用；不要复用生产值
      JWT_SECRET: ci-e2e-secret-not-for-production
      SESSION_SECRET: ci-e2e-secret-not-for-production
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Prisma Client
        run: npx prisma generate

      # P0-8：E2E 也用 migrate deploy 建表（空库从基线开始跑）
      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 的 webServer 会先 next build 再 next start -p 3111；
      # CI 下 retries=0、reuseExistingServer=false（见 playwright.config.ts）。
      - name: E2E smoke
        run: >-
          npx playwright test
          tests/e2e/browse.spec.ts
          tests/e2e/home-aggregate.spec.ts
          tests/e2e/mobile-drawer.spec.ts
          tests/e2e/auth.spec.ts
          tests/e2e/session-expired.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
