name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_notes_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/travel_notes_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & security tests
        run: npm test

      - name: Push database schema
        run: npx prisma db push --skip-generate

      - name: Build
        run: npm run build

      # 1.21.0：设计规范进 CI。
      # 门禁用「基线回归」（只拦新增违规）而不是 --strict（存量 439 处，直接 strict 等于永久红灯），
      # 收敛一批后用 npm run tokens -- --update-baseline 收紧基线。
      - name: Design tokens (baseline gate)
        run: npm run tokens:check

      # 报告模式：给出存量欠债的全貌，便于分批收敛（不阻塞）
      - name: Design token report
        run: npm run tokens

      - name: Dependency audit (high+, report only)
        run: npm audit --audit-level=high || true
