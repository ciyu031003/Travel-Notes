name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit & security tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          SKIP_DB_ON_BUILD: '1'
          SKIP_TSC: '1'
          DATABASE_URL: 'mysql://root:ci@localhost:3306/travel_notes_ci'
