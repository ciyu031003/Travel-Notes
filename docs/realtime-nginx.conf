# 甜途 · 实时协同 WebSocket 反向代理片段（P1b）
#
# 应用位置：站点 server { } 块内（HTTPS 443 与 8443 块都要加），放在 location / 之前即可
#          （^~ 前缀匹配优先于正则 location，务必用 ^~）。
# 上游：docker-compose 的 realtime 服务，只在宿主机回环监听 127.0.0.1:<COLLAB_PORT>（默认 1234）
# 生效：sudo nginx -t && sudo systemctl reload nginx   （reload 不断开已有连接；生产操作由运维执行）
#
# 说明：
#   · 必须带 proxy_http_version 1.1 + Upgrade/Connection 头，否则 WebSocket 握手失败；
#   · proxy_read_timeout 放大到 3600s，避免 60s 空闲被断开（应用层另有 25s 心跳）；
#   · token 在 query string 里（5 分钟有效），介意访问日志可在 location 内加 access_log off;
#   · 若 realtime 未启动/回滚，这里会返回 502；客户端会降级为纯 REST，不影响 app 其它功能。

location ^~ /collab {
    proxy_pass http://127.0.0.1:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 与主站一致：覆盖而不是追加 X-Forwarded-For（见 docs/nginx.conf.example 与 DEPLOYMENT.md）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # WebSocket 帧不需要缓冲，关掉可降延迟
    proxy_buffering off;
    proxy_cache off;

    # token 在 URL 里：不想记录到 access log 时打开这行
    # access_log off;
}
