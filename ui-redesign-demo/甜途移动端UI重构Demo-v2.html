<style>
/* ============================================================
   甜途 2.0 · Mobile UI Demo
   Design baseline: Vant 4 structure + iOS large title + 44px touch
   ============================================================ */
:root{
  --bg:#FFF6F8;
  --bg-soft:#FFEAF0;
  --surface:#FFFFFF;
  --surface-2:#FFF0F4;
  --surface-3:#F9DDE6;
  --text:#4A2B38;
  --text-2:#7E5C69;
  --text-3:#82606C;
  --line:#F3D9E2;
  --line-strong:#E8C4D1;
  --primary:#E76F91;
  --primary-strong:#B83F63;
  --grad-primary:linear-gradient(135deg,#C04569,#B83F63);
  --rose-on-white:#B83F63;
  --data-2:#8A5A08;
  --data-3:#6B4BA8;
  --primary-soft:#FDE7EE;
  --accent:#F5B84B;
  --accent-soft:#FFF1CF;
  --danger:#A62D3C;
  --danger-soft:#FDE8EC;
  --success:#1F6B5B;
  --info:#3F63BE;
  --like:#B93649;
  --mint:#9EDBD1; --mint-soft:#E8F8F4;
  --sky:#A9CDF7; --sky-soft:#EAF3FF;
  --lavender:#CDBDF4; --lavender-soft:#F2EDFF;
  --peach:#FFB795; --peach-soft:#FFF0E8;
  --honey:#F5B84B; --honey-soft:#FFF1CF;
  --glow-1:#FFE4ED; --glow-2:#EAF8F4; --glow-3:#FFF4D6;
  --shadow-1:0 1px 2px rgba(74,43,56,.04),0 10px 26px -18px rgba(201,79,115,.22);
  --shadow-2:0 18px 50px -20px rgba(201,79,115,.28);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#1A1015;
  --bg-soft:#24131A;
  --surface:#261720;
  --surface-2:#311C26;
  --surface-3:#412533;
  --text:#FFF1F5;
  --text-2:#DBB9C5;
  --text-3:#AA8493;
  --line:#402532;
  --line-strong:#5A3345;
  --primary:#F08AAA;
  --primary-strong:#FFB3C7;
  --data-2:#F7C76A;
  --data-3:#D3C4FF;
  --primary-soft:#3A1D28;
  --accent:#F7C76A;
  --accent-soft:#3D2D16;
  --danger:#FF8A98;
  --danger-soft:#3F1D24;
  --success:#6EE0B0;
  --info:#9DB9FF;
  --like:#FF7D99;
  --mint:#8BE0D2; --mint-soft:#15342E;
  --sky:#ABC8FF; --sky-soft:#1B2A3F;
  --lavender:#D3C4FF; --lavender-soft:#2B2340;
  --peach:#FFC2A8; --peach-soft:#3B241D;
  --honey:#F7C76A; --honey-soft:#3D2D16;
  --glow-1:#3A1B29; --glow-2:#2B2340; --glow-3:#3D2D16;
  --shadow-1:0 1px 2px rgba(0,0,0,.2),0 10px 28px -20px rgba(0,0,0,.8);
  --shadow-2:0 18px 60px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#FFE6EE;scroll-padding-bottom:120px}
body{
  margin:0;min-height:100dvh;background:#FFE6EE;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
input,textarea,select{outline:none}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

#app{
  position:relative;width:100%;max-width:430px;min-height:100dvh;margin:0 auto;
  background:var(--bg);overflow-x:hidden;box-shadow:0 0 0 1px rgba(201,79,115,.07),0 24px 80px rgba(201,79,115,.13);
}
@media(max-width:430px){body{background:var(--bg)}#app{box-shadow:none}}
.screen{min-height:100dvh;background:radial-gradient(120% 60% at 0% 0%,var(--glow-1),transparent 55%),radial-gradient(90% 45% at 100% 5%,var(--glow-2),transparent 52%),radial-gradient(70% 35% at 50% 100%,var(--glow-3),transparent 55%),var(--bg);background-attachment:fixed;padding-bottom:calc(88px + var(--safe-bottom));animation:screenIn .2s ease both}
.screen.no-tabbar{padding-bottom:0}
.screen.has-actionbar{padding-bottom:calc(92px + var(--safe-bottom))}
@keyframes screenIn{from{opacity:.55}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.fade-in{animation:fadeIn .2s ease both}
.rise{animation:rise .26s cubic-bezier(.22,1,.36,1) both}
/* ============================================================
   视觉资产：IconPark 线性图标 + Fluent Emoji 3D 动态图标
   IconPark: Apache-2.0 · https://github.com/bytedance/IconPark
   Fluent Emoji: MIT · https://github.com/microsoft/fluentui-emoji
   ============================================================ */
.emoji-3d{
  display:inline-block;object-fit:contain;flex:none;pointer-events:none;user-select:none;
  filter:drop-shadow(0 9px 14px rgba(201,79,115,.20));
  transform-origin:50% 72%;
  animation:emojiFloat 3.8s ease-in-out infinite;
}
.empty-icon-3d{
  width:88px;height:88px;background:radial-gradient(circle,var(--primary-soft) 0%,transparent 70%);
  border-radius:50%;margin-bottom:8px;
}
.empty-icon-3d .emoji-3d{width:78px;height:78px}
.toast{display:flex;align-items:center;justify-content:center;gap:8px}
.toast-emoji{width:24px;height:24px;filter:none;animation:emojiFloat 2.8s ease-in-out infinite}
@keyframes emojiFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-4px) rotate(2deg)}
}
@media (prefers-reduced-motion: reduce){
  .emoji-3d,.toast-emoji,.screen,.rise,.fade-in{animation:none!important}
  html{scroll-behavior:auto}
}


.safe-top{padding-top:calc(var(--safe-top) + 10px)}
.px-page{padding-left:18px;padding-right:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1)}
.card-flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.soft{background:var(--surface-2)}
.glass{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

.btn{min-height:44px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:650;transition:transform .12s,background .18s,opacity .18s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:0 10px 22px -14px rgba(184,63,99,.75)}
.btn-secondary{background:var(--primary-soft);color:var(--primary-strong)}
.btn-outline{border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-sm{min-height:44px;padding:0 14px;border-radius:12px;font-size:13px}
.btn-lg{min-height:50px;border-radius:14px;font-size:15px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-2);transition:background .18s,transform .12s}
.icon-btn:active{transform:scale(.92);background:var(--surface-2)}

.chip{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-full);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);background:var(--surface);white-space:nowrap}
.chip.active{background:var(--grad-primary);border-color:transparent;color:#fff;box-shadow:0 6px 16px -10px rgba(184,63,99,.72)}
.chip-soft{background:var(--primary-soft);border-color:transparent;color:var(--primary-strong)}
.pill{padding:4px 9px;border-radius:var(--r-full);font-size:11px;font-weight:650;display:inline-flex;align-items:center;gap:4px}
.pill-primary{background:var(--primary-soft);color:var(--primary-strong)}
.pill-accent{background:var(--accent-soft);color:#8A5A08}
[data-theme="dark"] .pill-accent{color:var(--accent)}
.pill-danger{background:var(--danger-soft);color:var(--danger)}

.tone-pink{background:var(--primary-soft);color:var(--primary-strong)}
.tone-mint{background:var(--mint-soft);color:#1F6B5B}
.tone-sky{background:var(--sky-soft);color:#33629F}
.tone-honey{background:var(--honey-soft);color:#8A5A08}
.tone-lavender{background:var(--lavender-soft);color:#7757B7}
.tone-peach{background:var(--peach-soft);color:#A84E2C}
[data-theme="dark"] .tone-mint{color:#8BE0D2}
[data-theme="dark"] .tone-sky{color:#ABC8FF}
[data-theme="dark"] .tone-honey{color:#F7C76A}
[data-theme="dark"] .tone-lavender{color:#D3C4FF}
[data-theme="dark"] .tone-peach{color:#FFC2A8}
.type-COUPLE{background:#FFE4ED;color:#B93B60}
.type-ALONE{background:#F0EAFF;color:#6D51B0}
.type-FRIENDS{background:#E6F8F4;color:#1F6B5B}
.type-FAMILY{background:#FFF1CF;color:#96620A}
.type-GROUP{background:#EAF3FF;color:#3B6FA8}
.type-BFF{background:#FFEAF3;color:#B04478}
.type-OTHER{background:var(--surface-2);color:var(--text-2)}
[data-theme="dark"] .type-COUPLE{background:#3B1D28;color:#FFB3C7}
[data-theme="dark"] .type-ALONE{background:#2B2340;color:#D3C4FF}
[data-theme="dark"] .type-FRIENDS{background:#15342E;color:#8BE0D2}
[data-theme="dark"] .type-FAMILY{background:#3D2D16;color:#F7C76A}
[data-theme="dark"] .type-GROUP{background:#1B2A3F;color:#ABC8FF}
.stat-mini>div:nth-child(1) b{color:var(--primary-strong)}
.stat-mini>div:nth-child(2) b{color:#8A5A08}
.stat-mini>div:nth-child(3) b{color:#1F6B5B}
.stat-box:nth-child(3n+1) b{color:var(--primary-strong)}
.stat-box:nth-child(3n+2) b{color:#8A5A08}
.stat-box:nth-child(3n+3) b{color:#1F6B5B}
[data-theme="dark"] .stat-mini>div:nth-child(2) b,[data-theme="dark"] .stat-box:nth-child(3n+2) b{color:var(--honey)}
[data-theme="dark"] .stat-mini>div:nth-child(3) b,[data-theme="dark"] .stat-box:nth-child(3n+3) b{color:var(--mint)}

/* 樱花粉撞色系统：樱花粉为主调，薄荷 / 晴空 / 香芋 / 蜂蜜 / 蜜桃做轻撞色 */
.quick-actions>button:nth-child(1) span:first-child{background:var(--primary-soft)!important;color:var(--primary-strong)!important}
.quick-actions>button:nth-child(2) span:first-child{background:var(--peach-soft)!important;color:#A84E2C!important}
.quick-actions>button:nth-child(3) span:first-child{background:var(--mint-soft)!important;color:#1F6B5B!important}
.quick-actions>button:nth-child(4) span:first-child{background:var(--sky-soft)!important;color:#33629F!important}
.footprint-stats>div:nth-child(1) b{color:var(--primary-strong)}
.footprint-stats>div:nth-child(2) b{color:#8A5A08}
.footprint-stats>div:nth-child(3) b{color:#1F6B5B}
[data-theme="dark"] .footprint-stats>div:nth-child(2) b{color:var(--honey)}
[data-theme="dark"] .footprint-stats>div:nth-child(3) b{color:var(--mint)}
.profile-quicknav>button:nth-child(1) span:first-child{background:var(--primary-soft)!important;color:var(--primary-strong)!important}
.profile-quicknav>button:nth-child(2) span:first-child{background:var(--honey-soft)!important;color:#8A5A08!important}
.profile-quicknav>button:nth-child(3) span:first-child{background:var(--lavender-soft)!important;color:#7757B7!important}
.profile-quicknav>button:nth-child(4) span:first-child{background:var(--mint-soft)!important;color:#1F6B5B!important}
.content-list .list-row:nth-child(1) .list-icon{background:var(--primary-soft);color:var(--primary-strong)}
.content-list .list-row:nth-child(2) .list-icon{background:var(--peach-soft);color:#A84E2C}
.content-list .list-row:nth-child(3) .list-icon{background:var(--sky-soft);color:#33629F}
.content-list .list-row:nth-child(4) .list-icon{background:var(--lavender-soft);color:#7757B7}
[data-theme="dark"] .quick-actions>button:nth-child(2) span:first-child{background:var(--peach-soft)!important;color:var(--peach)!important}
[data-theme="dark"] .content-list .list-row:nth-child(2) .list-icon{background:var(--peach-soft);color:var(--peach)}
[data-theme="dark"] .quick-actions>button:nth-child(3) span:first-child{background:var(--mint-soft)!important;color:var(--mint)!important}
[data-theme="dark"] .profile-quicknav>button:nth-child(4) span:first-child{background:var(--mint-soft)!important;color:var(--mint)!important}
[data-theme="dark"] .quick-actions>button:nth-child(4) span:first-child{background:var(--sky-soft)!important;color:var(--sky)!important}
[data-theme="dark"] .content-list .list-row:nth-child(3) .list-icon{background:var(--sky-soft);color:var(--sky)}
[data-theme="dark"] .profile-quicknav>button:nth-child(3) span:first-child{background:var(--lavender-soft)!important;color:var(--lavender)!important}
[data-theme="dark"] .content-list .list-row:nth-child(4) .list-icon{background:var(--lavender-soft);color:var(--lavender)}
[data-theme="dark"] .profile-quicknav>button:nth-child(2) span:first-child{background:var(--honey-soft)!important;color:var(--honey)!important}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg-btn{height:44px;border-radius:11px;font-size:13px;font-weight:650;color:var(--text-2)}
.seg-btn.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(201,79,115,.10)}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.section-link{font-size:13px;font-weight:650;color:var(--primary-strong);display:inline-flex;align-items:center;justify-content:center;gap:3px;min-height:44px;min-width:44px;padding:0 2px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.divider{height:1px;background:var(--line)}
.tnum{font-variant-numeric:tabular-nums}

.avatar{display:inline-flex;border-radius:50%;background:var(--surface-3);overflow:hidden;flex:none}
.img-cover{width:100%;height:100%;object-fit:cover}
.img-fallback{background:linear-gradient(140deg,var(--primary-soft),var(--surface-2) 55%,var(--accent-soft))!important}
.img-fallback::after{content:"";position:absolute;inset:18%;border:1.5px dashed color-mix(in srgb,var(--primary) 35%,transparent);border-radius:50% 40% 55% 45%}

.hero-img{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--primary-soft),var(--surface-2))}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(74,20,43,.82) 0%,rgba(74,20,43,.16) 62%,rgba(74,20,43,.05) 100%)}
.hero-card{border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow-2)}

.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .35s}
.progress-soft{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress-soft>i{display:block;height:100%;border-radius:99px;background:var(--primary-strong);transition:width .35s}

.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;padding:6px 8px calc(6px + var(--safe-bottom));border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab-grid{display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab-item{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:11px;font-weight:650}
.tab-item.active{color:var(--primary-strong)}
.tab-fab-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-13px;font-size:11px;font-weight:700;color:var(--primary-strong)}
.tab-fab{width:46px;height:46px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -9px rgba(217,87,121,.8),0 0 0 4px var(--bg);transition:transform .12s}
.tab-fab:active{transform:scale(.92)}

.topbar{position:sticky;top:0;z-index:40;padding-top:var(--safe-top);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-color:var(--line)}
.navbar{height:54px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px}
.navbar-title{font-size:16px;font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar-side{width:44px;display:flex;align-items:center;justify-content:center}

.field{display:flex;flex-direction:column;gap:7px}
.field-label{font-size:13px;font-weight:650;color:var(--text-2)}
.input,.textarea,.select{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;min-height:46px;padding:11px 13px;font-size:15px;color:var(--text);transition:border-color .18s,box-shadow .18s}
.textarea{min-height:92px;resize:vertical}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.search-bar:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.search-bar input:focus-visible{outline:none}
.hint{font-size:12px;line-height:1.55;color:var(--text-3)}
.error-text{font-size:12px;color:var(--danger)}

.list-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list-row{min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;position:relative}
.list-row+.list-row::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.list-row:active{background:var(--surface-2)}
.list-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary-strong);flex:none}
.list-main{flex:1;min-width:0}
.list-title{display:block;font-size:14px;font-weight:600;color:var(--text)}
.list-sub{display:block;font-size:12px;color:var(--text-3);margin-top:2px}

.sheet-mask,.modal-mask{position:fixed;inset:0;z-index:80;background:rgba(58,20,36,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .18s ease both}
.sheet-panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;max-height:90dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:81;padding:8px 18px calc(22px + var(--safe-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.28);animation:sheetUp .28s cubic-bezier(.22,1,.36,1) both}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:2px auto 14px}
.sheet-title{font-size:18px;font-weight:700;padding-right:36px}
.sheet-close{position:absolute;right:12px;top:16px}
.modal-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 40px);max-width:350px;background:var(--bg);border-radius:20px;z-index:81;padding:20px;box-shadow:var(--shadow-2);animation:rise .2s ease both}
.action-row{min-height:54px;display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left;border-radius:12px}
.action-row:active{background:var(--surface-2)}
.action-row.danger{color:var(--danger)}
.action-icon{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}

.bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:100%;max-width:430px;padding:10px 16px calc(12px + var(--safe-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);box-shadow:0 -12px 30px -22px rgba(74,43,56,.35)}
.bottom-bar .btn{width:100%}
.form-section{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-1)}
.form-section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:750;color:var(--text);margin:0}
.form-section-title::before{content:"";width:3px;height:14px;border-radius:99px;background:var(--grad-primary)}
.field-invalid .input,.field-invalid .textarea,.field-invalid .select{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 16%,transparent)}
.field-invalid .field-label{color:var(--danger)}
.error-text{margin-top:-2px;font-weight:600}
:where(button,a,input,textarea,select,[role="button"]):focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:108px;transform:translate(-50%,12px);z-index:100;background:rgba(68,26,43,.94);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:all .22s ease;pointer-events:none;max-width:calc(100vw - 48px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:rgba(120,22,18,.95)}

.empty{text-align:center;padding:42px 22px}
.empty-icon{width:58px;height:58px;border-radius:19px;background:var(--primary-soft);color:var(--primary-strong);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.empty-title{font-size:15px;font-weight:650}
.empty-desc{font-size:13px;line-height:1.65;color:var(--text-3);margin-top:5px}

.day-chip{min-width:58px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:center;flex:none}
.day-chip b{display:block;font-size:13px}
.day-chip span{display:block;font-size:11px;color:var(--text-3);margin-top:1px}
.day-chip.active{background:var(--grad-primary);border-color:transparent;color:#fff}
.day-chip.active span{color:#fff}

.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:11px;top:7px;bottom:7px;width:1px;background:var(--line-strong)}
.timeline-item{position:relative;padding-bottom:18px}
.timeline-dot{position:absolute;left:-30px;top:1px;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary-strong);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.photo-tile{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.photo-tile:first-child{grid-column:span 2;grid-row:span 2;border-radius:13px}
.photo-tile img{width:100%;height:100%;object-fit:cover;transition:transform .25s}
.photo-tile:active img{transform:scale(1.04)}

.post-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-1)}
.post-cover{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
.post-cover img{width:100%;height:100%;object-fit:cover}
.post-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(74,20,43,.58),transparent 52%)}
.post-head{display:flex;align-items:center;gap:9px;padding:12px 14px}
.post-body{padding:0 14px 13px}
.post-actions{display:flex;align-items:center;gap:6px;padding:0 10px 10px}
.action-pill{min-height:44px;min-width:44px;padding:0 11px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.action-pill:active{background:var(--surface-2)}
.action-pill.on{color:var(--like)}
.action-pill.saved{color:var(--primary-strong)}

.space-card{position:relative;overflow:hidden;border-radius:20px;color:#fff;min-height:174px;box-shadow:var(--shadow-1)}
.space-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.space-card::after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,rgba(95,30,57,.88),rgba(201,79,115,.2) 60%,rgba(74,28,48,.76))}
.space-card-content{position:relative;z-index:1;padding:18px;height:100%;display:flex;flex-direction:column}

.book-cover{position:relative;aspect-ratio:3/4;border-radius:5px 13px 13px 5px;overflow:hidden;box-shadow:6px 10px 22px -12px rgba(95,30,57,.55);background:var(--surface-3)}
.book-cover::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.32),rgba(255,255,255,.15),rgba(0,0,0,.08));z-index:2}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(58,20,36,.72),transparent 55%)}

.map-card{position:relative;overflow:hidden;background:linear-gradient(140deg,#FFE6EE,#FFF8F3 52%,#FFF1CF);border:1px solid var(--line);border-radius:20px;min-height:176px}
[data-theme="dark"] .map-card{background:linear-gradient(140deg,#3A1D28,#241720 52%,#3D2D16);border-color:var(--line)}
.map-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 16%,transparent)}
.map-dot.big{width:11px;height:11px;background:var(--accent)}
.map-route{position:absolute;border:1.5px dashed color-mix(in srgb,var(--primary) 45%,transparent);border-radius:50%;transform:rotate(-12deg)}

.kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 10px;text-align:center}
.stat-box b{display:block;font-size:21px;letter-spacing:-.03em;line-height:1.1}
.stat-box span{display:block;font-size:11px;color:var(--text-3);margin-top:4px}
.stat-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:15px;overflow:hidden;border:1px solid var(--line)}
.stat-mini>div{background:var(--surface);padding:13px 8px;text-align:center}
.stat-mini b{display:block;font-size:18px;line-height:1.1}
.stat-mini span{display:block;font-size:11px;color:var(--text-3);margin-top:3px}

.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

.offline-banner{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:#8A5B08;font-size:12px;font-weight:600;line-height:1.5}
[data-theme="dark"] .offline-banner{color:var(--accent)}

.sheet-form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.sheet-form-grid>*{min-width:0}
.form-stack{display:flex;flex-direction:column;gap:14px}
.form-actions{position:sticky;bottom:-22px;padding:14px 0 calc(8px + var(--safe-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent);margin-top:4px}

.review-star{position:relative;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.review-star::after{content:"";position:absolute;inset:-7px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:50%}

.no-scrollbar{scrollbar-width:none}
.no-scrollbar::-webkit-scrollbar{display:none}
.line-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-danger{color:var(--danger)}
</style>
</head>

function parseRoute() {
  const raw = (location.hash || '#/home').replace(/^#\/?/, '');
  const [pathPart, queryPart = ''] = raw.split('?');
  const parts = pathPart.split('/').filter(Boolean);
  const params = Object.fromEntries(new URLSearchParams(queryPart));
  const key = parts[0] || 'home';
  if (key === 'trip' && parts[1]) params.id = Number(parts[1]);
  if (key === 'post' && parts[1]) params.id = Number(parts[1]);
  if (key === 'space' && parts[1]) params.id = Number(parts[1]);
  if (key === 'album' && parts[1]) params.id = Number(parts[1]);
  if (key === 'user' && parts[1]) params.id = Number(parts[1]);
  state.route = key;
  state.params = params;
  if (params.tab && ['overview','itinerary','album','expense'].includes(params.tab)) state.tripTab = params.tab;
  if (params.mode && ['book','gallery','star'].includes(params.mode)) state.albumMode = params.mode;
  return { key, params };
}
function go(path) {
  location.hash = path.startsWith('#') ? path : '#/' + path.replace(/^\//, '');
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function back(fallback = 'home') {
  if (history.length > 1) history.back();
  else go(fallback);
}
function showTabbar(route) {
  return ['home', 'journeys', 'circle', 'me'].includes(route);
}
function activeTab(route) {
  if (route === 'home') return 'home';
  if (['journeys','trip','albums','album','timeline','moments','dashboard','search'].includes(route)) return 'journeys';
  if (['circle','post','user'].includes(route)) return 'circle';
  if (['me','spaces','space','settings','notifications','favorites','sync'].includes(route)) return 'me';
  return 'home';
}

function toast(message, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.setAttribute('role','status');
  el.setAttribute('aria-live','polite');
  const celebrate = /创建|保存|完成|成功|发布|解锁|上传|欢迎回来/.test(message);
  const toastIcon = type === 'error' ? '' : emoji3D(celebrate ? 'party' : 'sparkles', 'toast-emoji', .15);
  el.innerHTML = `${toastIcon}<span>${esc(message)}</span>`;
  toastRoot.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 240); }, 1900);
}

function openSheet(title, body, { footer = '', wide = false } = {}) {
  lastFocused = document.activeElement;
  layerRoot.innerHTML = `<div class="sheet-mask" data-close-layer></div>
    <section class="sheet-panel ${wide ? 'sm:max-w-[430px]' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-grip"></div>
      <button class="icon-btn sheet-close" data-close-layer aria-label="关闭">${icon('x', 'w-5 h-5')}</button>
      <h2 class="sheet-title">${esc(title)}</h2>
      <div class="mt-4">${body}</div>
      ${footer ? `<div class="mt-4">${footer}</div>` : ''}
    </section>`;
  requestAnimationFrame(() => {
    const target = layerRoot.querySelector('[autofocus]') || layerRoot.querySelector('input:not([type="hidden"]), textarea, select') || layerRoot.querySelector('.sheet-close');
    target?.focus?.({ preventScroll: true });
  });
}
function closeLayer() {
  layerRoot.innerHTML = '';
  try { lastFocused?.focus?.({ preventScroll: true }); } catch {}
  lastFocused = null;
}

function openDialog({ title, message, confirmText = '确定', destructive = false, onConfirm }) {
  layerRoot.innerHTML = `<div class="modal-mask" data-close-layer></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3 class="text-[17px] font-bold">${esc(title)}</h3>
      <p class="text-[13px] leading-6 muted mt-2">${esc(message)}</p>
      <div class="flex gap-2 mt-5">
        <button class="btn btn-outline flex-1" data-close-layer>取消</button>
        <button class="btn ${destructive ? 'btn-danger' : 'btn-primary'} flex-1" id="dialog-confirm">${esc(confirmText)}</button>
      </div>
    </section>`;
  requestAnimationFrame(() => layerRoot.querySelector('.modal-panel [data-close-layer]')?.focus?.({ preventScroll: true }));
  $('#dialog-confirm').onclick = () => { closeLayer(); onConfirm?.(); };
}

function openActionSheet(title, items) {
  openSheet(title, `<div class="space-y-1">${items.map(it => `
    <button class="action-row ${it.danger ? 'danger' : ''}" data-action-sheet-item="${esc(it.key)}">
      <span class="action-icon">${icon(it.icon || 'chevron-right', 'w-5 h-5')}</span>
      <span class="min-w-0 flex-1"><span class="block text-[15px] font-semibold">${esc(it.label)}</span>${it.hint ? `<span class="block text-[11px] faint mt-0.5">${esc(it.hint)}</span>` : ''}</span>
    </button>`).join('')}</div><button class="btn btn-outline btn-block mt-3" data-close-layer>取消</button>`);
  layerRoot.querySelectorAll('[data-action-sheet-item]').forEach(btn => {
    btn.onclick = () => {
      const item = items.find(x => x.key === btn.dataset.actionSheetItem);
      closeLayer();
      item?.onClick?.();
    };
  });
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = state.theme;
  render();
  toast(state.theme === 'dark' ? '已切换深色模式' : '已切换浅色模式');
}

function handleAction(action, el) {
  const id = Number(el.dataset.id || 0);
  switch (action) {
    case 'back': back(el.dataset.fallback || 'home'); break;
    case 'open-record': openRecordMenu(); break;
    case 'open-record-memory': openMemoryForm(); break;
    case 'open-record-photo': openPhotoForm(); break;
    case 'open-record-expense': openExpenseForm(); break;
    case 'new-trip': go('new-trip'); break;
    case 'quick-memory': openMemoryForm(id); break;
    case 'quick-photo': openPhotoForm(id); break;
    case 'add-itinerary': openItineraryForm(id, el.dataset.day || ''); break;
    case 'add-expense': openExpenseForm(id); break;
    case 'upload-photos': openPhotoForm(id); break;
    case 'open-photo': openPhoto(el.dataset.src, el.dataset.title || '照片'); break;
    case 'photo-comment': openPhotoCommentSheet(); break;
    case 'open-book': state.bookPage = 0; openBookViewer(id || 1); break;
    case 'book-prev': if (state.bookPage > 0) { state.bookPage--; openBookViewer(id || 1); } else { toast('已经是第一页'); } break;

/* ============================================================
   15. 表单提交
   ============================================================ */
function formValue(form, name) { return form.elements[name]?.value?.trim?.() ?? ''; }
function formRadio(form, name) { return form.querySelector(`input[name="${name}"]:checked`)?.value || ''; }
function fieldError(form, name, message) {
  const input = form.elements[name];
  const field = input?.closest('.field');
  if (!input || !field) { toast(message, 'error'); return false; }
  field.classList.add('field-invalid');
  input.setAttribute('aria-invalid', 'true');
  let error = field.querySelector('.error-text');
  if (!error) { error = document.createElement('p'); error.className = 'error-text'; field.appendChild(error); }
  error.textContent = message;
  input.focus({ preventScroll: true });
  input.scrollIntoView({ block: 'center', behavior: 'smooth' });
  return false;
}

document.addEventListener('input', event => {
  const field = event.target.closest('.field-invalid');
  if (!field) return;
  field.classList.remove('field-invalid');
  event.target.removeAttribute('aria-invalid');
  field.querySelector('.error-text')?.remove();
});

document.addEventListener('submit', event => {
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  const kind = form.dataset.form;
  const id = Number(form.dataset.id || 0);

  if (kind === 'new-trip') {
    const location = formValue(form,'location');
    const startDate = formValue(form,'startDate');
    const endDate = formValue(form,'endDate');
    if (!location) { fieldError(form,'location','请输入目的地'); return; }
    if (!startDate) { fieldError(form,'startDate','请选择开始日期'); return; }
    if (!endDate) { fieldError(form,'endDate','请选择结束日期'); return; }
    if (endDate < startDate) { fieldError(form,'endDate','结束日期不能早于开始日期'); return; }
    const title = formValue(form,'title') || location;
    const days = Math.max(1, Math.round((new Date(endDate) - new Date(startDate)) / 86400000) + 1);
    const trip = { id: Date.now(), title, location, startDate, endDate, status:'active', type:formRadio(form,'type')||'COUPLE', companion:formValue(form,'companion')||'独自出发', cover:IMG.road, photos:0, days, budget:0, spent:0, spaceId:Number(formValue(form,'spaceId'))||null, province:'', city:'', description:'刚刚开始记录的旅程。', itinerary:[{date:startDate.slice(5),week:'待定',label:startDate.slice(5),title:'抵达与安顿',items:[]}], memories:[], expenses:[] };
    DB.trips.unshift(trip); state.selectedDay='all'; toast('旅程已创建'); go('trip/'+trip.id); return;
  }
  if (kind === 'memory') {
    const trip = DB.trips.find(t=>t.id===Number(formValue(form,'tripId'))) || DB.trips[0];
    const title = formValue(form,'title');
    if (!title) { fieldError(form,'title','给这条回忆写个标题吧'); return; }
    trip.memories.unshift({id:Date.now(),day:formValue(form,'day')||'今天',title,content:formValue(form,'content'),mood:formRadio(form,'mood')||'此刻',photos:[IMG.boat,IMG.sea],visibility:formRadio(form,'visibility')||'同行者'});
    closeLayer(); render(); toast('回忆已保存'); return;
  }
  if (kind === 'photos') {
    const trip = DB.trips.find(t=>t.id===Number(formValue(form,'tripId'))) || DB.trips[0];
    trip.photos += 3; closeLayer(); render(); toast('3 张照片已上传并归档'); return;
  }
  if (kind === 'expense') {
    const trip = DB.trips.find(t=>t.id===Number(formValue(form,'tripId'))) || DB.trips[0];
    const amount = Number(formValue(form,'amount'));
    if (!amount || amount <= 0) { fieldError(form,'amount','请输入有效金额'); return; }
    trip.expenses.unshift({id:Date.now(),category:formRadio(form,'category')||'其他',title:formValue(form,'title')||'旅行花销',amount,date:formValue(form,'date')||'今天',payer:formValue(form,'payer')||'我'});
    trip.spent += amount; closeLayer(); render(); toast('已记一笔 ¥'+money(amount)); return;
  }
  if (kind === 'itinerary') {
    const trip = DB.trips.find(t=>t.id===id) || DB.trips[0];
    const dayLabel = formValue(form,'day');
    const day = trip.itinerary.find(d=>d.label===dayLabel) || trip.itinerary[0];
    const title = formValue(form,'title');
    if (!title) { fieldError(form,'title','请输入行程名称'); return; }
    day.items.push({time:formValue(form,'time')||'待定',type:formValue(form,'type')||'map-pin',title,place:formValue(form,'place')||'',note:formValue(form,'note')||'',expense:0});
    closeLayer(); render(); toast('行程已添加'); return;
  }
  if (kind === 'moment') {
    const content = formValue(form,'content');
    if (!content) { fieldError(form,'content','写点什么再发布吧'); return; }
    DB.moments.unshift({id:Date.now(),text:content,time:'刚刚',mood:formRadio(form,'mood')||'此刻'}); closeLayer(); render(); toast('已发布碎碎念'); return;
  }
  if (kind === 'comment') {
    const content = formValue(form,'content');
    if (!content) { fieldError(form,'content','写点什么再发布吧'); return; }
    const post = DB.posts.find(p=>p.id===id); if(!post) return;
    DB.comments[id] = DB.comments[id] || [];
    DB.comments[id].push({id:Date.now(),user:DB.user.name,avatar:DB.user.avatar,text:content,time:'刚刚',likes:0,liked:false});
    post.comments += 1; closeLayer(); render(); toast('评论已发布'); return;
  }
  if (kind === 'new-album') {
    const title = formValue(form,'title'); if(!title){fieldError(form,'title','请输入相册名称');return;}
    DB.albums.unshift({id:Date.now(),title,date:'2026.11',photos:0,cover:IMG.dusk,locked:false,type:'其他',tripId:Number(formValue(form,'tripId'))||null});
    closeLayer(); render(); toast('相册已创建'); return;
  }
  if (kind === 'create-space') {
    const name = formValue(form,'name'); if(!name){fieldError(form,'name','请输入空间名称');return;}
    const type=formRadio(form,'type')||'COUPLE'; const typeLabel={COUPLE:'情侣空间',FRIENDS:'朋友空间',FAMILY:'家庭空间',ALONE:'个人空间'}[type]||'共享空间';
    DB.spaces.unshift({id:Date.now(),name,type,typeLabel,role:'OWNER',members:1,travels:0,albums:0,memories:0,photos:0,cover:IMG.road,desc:formValue(form,'desc')||'一起记录，各自上色。',memberList:[{name:DB.user.name,role:'主人',avatar:DB.user.avatar}],activity:[]});
    closeLayer(); render(); toast('空间已创建，去邀请伙伴吧'); return;
  }
  if (kind === 'join-space') { const code=formValue(form,'code'); if(!code){fieldError(form,'code','请输入邀请码');return;} closeLayer(); toast('已加入空间「山与海之间」'); go('space/1'); return; }
  if (kind === 'profile') { DB.user.name=formValue(form,'nickname')||DB.user.name; DB.user.bio=formValue(form,'bio')||DB.user.bio; closeLayer(); render(); toast('资料已保存'); return; }
  if (kind === 'register') { const username=formValue(form,'username'), password=formValue(form,'password'), confirm=formValue(form,'confirm'); if(!username){fieldError(form,'username','请输入用户名');return;} if(password.length<8){fieldError(form,'password','密码至少需要 8 位');return;} if(password!==confirm){fieldError(form,'confirm','两次输入的密码不一致');return;} DB.user.name=username; state.loggedIn=true; closeLayer(); toast('注册成功'); go('home'); return; }
  if (kind === 'password') { const next=formValue(form,'next'), confirm=formValue(form,'confirm'); if(next.length<8){fieldError(form,'next','新密码至少需要 8 位');return;} if(next!==confirm){fieldError(form,'confirm','两次输入的密码不一致');return;} closeLayer(); toast('密码已更新'); return; }
  if (kind === 'email') { const email=formValue(form,'email'); if(!email.includes('@')){fieldError(form,'email','请输入有效邮箱');return;} closeLayer(); toast('邮箱绑定成功'); return; }
  if (kind === 'preference') { DB.preferences.companion=formRadio(form,'companion')||'COUPLE'; closeLayer(); toast('旅行偏好已保存'); return; }
  if (kind === 'unlock-album') { const pwd=formValue(form,'password').replaceAll('/','-').replace('年','-').replace('月','-').replace('日',''); if(pwd==='2023-06-20'){state.unlockedAlbums.add(id);closeLayer();go('album/'+id);toast('相册已解锁');}else{fieldError(form,'password','密码不正确，请重试');} return; }
  if (kind === 'budget') { const t=DB.trips.find(x=>x.id===id); const b=Number(formValue(form,'budget')); if(!t){return;} if(!(b>0)){fieldError(form,'budget','请输入大于 0 的预算');return;} t.budget=b;closeLayer();render();toast('预算已更新'); return; }
  if (kind === 'search') { state.searchQuery=formValue(form,'query'); render(); setTimeout(()=>$('#search-input')?.focus(),20); return; }
  if (kind === 'report') { const reason=formValue(form,'reason'); if(!reason){fieldError(form,'reason','请填写举报原因');return;} closeLayer(); toast('举报已提交，等待处理'); return; }
  if (kind === 'photo-comment') { const c=formValue(form,'content'); if(!c){fieldError(form,'content','写一句留言再发送');return;} closeLayer(); toast('留言已发送'); return; }
  if (kind === 'forgot') { closeLayer(); toast('验证码验证成功，请设置新密码（Demo）'); return; }
  if (kind === 'login') { const username=formValue(form,'username'), password=formValue(form,'password'); if(!username){fieldError(form,'username','请输入用户名');return;} if(!password){fieldError(form,'password','请输入密码');return;} state.loggedIn=true; toast('欢迎回来'); go('home'); return; }
});

/* ============================================================
   16. 渲染入口与事件绑定
   ============================================================ */
function render() {
  const { key } = parseRoute();
  if (!state.loggedIn && key !== 'auth') { location.hash = '#/auth'; return; }
  if (key === 'trip' && !state.params.tab) state.tripTab = 'overview';
  if (key !== 'trip') state.selectedDay = 'all';

  let html = '';
  switch (key) {
    case 'auth': html = viewAuth(); break;
    case 'journeys': html = viewJourneys(); break;
    case 'trip': html = viewTrip(); break;
    case 'albums': html = viewAlbums(); break;
    case 'album': html = viewAlbumDetail(); break;
    case 'circle': html = viewCircle(); break;
    case 'post': html = viewPost(); break;
    case 'user': html = viewUser(); break;
    case 'spaces': html = viewSpaces(); break;
    case 'space': html = viewSpace(); break;
    case 'me': html = viewMe(); break;
    case 'notifications': html = viewNotifications(); break;
    case 'favorites': html = viewFavorites(); break;
    case 'timeline': html = viewTimeline(); break;
    case 'moments': html = viewMoments(); break;
    case 'dashboard': html = viewDashboard(); break;
    case 'search': html = viewSearch(); break;
    case 'settings': html = viewSettings(); break;
    case 'sync': html = viewSync(); break;
    case 'new-trip': html = viewNewTrip(); break;
    default: html = viewHome(); break;
  }

  app.innerHTML = html + (showTabbar(key) ? tabbar(activeTab(key)) : '');
  document.documentElement.dataset.theme = state.theme;
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && layerRoot.innerHTML.trim()) closeLayer();
});

document.addEventListener('click', event => {
  const close = event.target.closest('[data-close-layer]');
  if (close) { closeLayer(); return; }

  const goEl = event.target.closest('[data-go]');
  if (goEl) { event.preventDefault(); go(goEl.dataset.go); return; }

  const actionEl = event.target.closest('[data-action]');
  if (actionEl) { event.preventDefault(); handleAction(actionEl.dataset.action, actionEl); return; }

  const tripTab = event.target.closest('[data-trip-tab]');
  if (tripTab) { state.tripTab = tripTab.dataset.tripTab; go(`trip/${state.params.id}?tab=${state.tripTab}`); return; }

  const dayEl = event.target.closest('[data-day-select]');
  if (dayEl) { state.selectedDay = dayEl.dataset.daySelect; render(); return; }

  const albumMode = event.target.closest('[data-album-mode]');
  if (albumMode) { state.albumMode = albumMode.dataset.albumMode; go(`albums?mode=${state.albumMode}`); return; }

  const albumFilter = event.target.closest('[data-album-filter]');
  if (albumFilter) { state.albumFilter = albumFilter.dataset.albumFilter; render(); return; }

  const circleTab = event.target.closest('[data-circle-tab]');
  if (circleTab) { state.circleTab = circleTab.dataset.circleTab; render(); return; }

  const circleFilter = event.target.closest('[data-circle-filter]');
  if (circleFilter) { state.circleFilter = circleFilter.dataset.circleFilter; render(); return; }

  const spaceTab = event.target.closest('[data-space-tab]');
  if (spaceTab) { state.spaceTab = spaceTab.dataset.spaceTab; render(); return; }

  const journeyFilter = event.target.closest('[data-journey-filter]');
  if (journeyFilter) { state.journeyFilter = journeyFilter.dataset.journeyFilter; render(); return; }

  const searchTag = event.target.closest('[data-search-tag]');
  if (searchTag) { state.searchQuery = searchTag.dataset.searchTag; render(); setTimeout(()=>$('#search-input')?.focus(),20); return; }
});

document.addEventListener('change', event => {
  const input = event.target.closest('.chip input');
  if (!input) return;
  const group = input.closest('.field') || input.closest('.grid');
  if (input.type === 'radio') {
    $$('.chip', group).forEach(label => label.classList.remove('active'));
    input.closest('.chip')?.classList.add('active');
  } else {
    input.closest('.chip')?.classList.toggle('active', input.checked);
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('scroll', () => {
  $$('.topbar').forEach(bar => bar.classList.toggle('scrolled', window.scrollY > 4));
}, { passive: true });

if (!location.hash) location.hash = '#/home';
render();

</script>
</body>
</html>
