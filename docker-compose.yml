services:
  db:
    image: mysql:8.4
    container_name: travel-notes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Abd123456.}
      MYSQL_DATABASE: travel_notes
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-Abd123456.}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-notes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-Abd123456.}@db:3306/travel_notes"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-secret}
      # App 端登录 Cookie 强制 SameSite=None+Secure（代码已固定），Web 端这里控制；HTTPS 部署建议 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NEXT_PUBLIC_SITE_TITLE: ${NEXT_PUBLIC_SITE_TITLE:-Travel-Notes}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # 敏感配置(AES-256-GCM)解密主密钥, 仅服务端读取, 不进代码
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # OTA 版本（/api/version 供 App 检查更新；每次发版递增 APP_BUILD_NUMBER）
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_BUILD_NUMBER: ${APP_BUILD_NUMBER:-1}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-https://travel-notes.yuanabd.cn/downloads/tiantu.apk}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # 媒体存储已迁移至 COS 存储桶（cosfs 挂载于宿主机 /data）。
      # 迁移日 2026-09-06：原 uploads-data 卷保留未删作为回滚备份（/var/lib/docker/volumes/travel-notes_uploads-data）。
      - /data/travel-notes/uploads:/app/public/uploads

volumes:
  mysql-data:
