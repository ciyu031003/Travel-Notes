services:
  db:
    image: mysql:8.4
    container_name: travel-notes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Abd123456.}
      MYSQL_DATABASE: travel_notes
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-Abd123456.}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-notes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-Abd123456.}@db:3306/travel_notes"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NEXT_PUBLIC_SITE_TITLE: ${NEXT_PUBLIC_SITE_TITLE:-Travel-Notes}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # 敏感配置(AES-256-GCM)解密主密钥, 仅服务端读取, 不进代码
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/public/uploads

volumes:
  mysql-data:
  uploads-data:
