services:
  db:
    image: mysql:8.4
    container_name: travel-notes-db
    restart: unless-stopped
    environment:
      # P2-33：原来默认密码 Abd123456. 是可直接登录的弱口令；改成明显无效的占位符。
      # 必须在 .env 里显式设置 MYSQL_ROOT_PASSWORD（见 docs/DEPLOYMENT.md「升级注意」）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-__SET_MYSQL_ROOT_PASSWORD_IN_ENV__}
      MYSQL_DATABASE: travel_notes
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-__SET_MYSQL_ROOT_PASSWORD_IN_ENV__}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ===== 可选：Redis（多副本共享限流/缓存）=====
  # 默认**不启动**（profiles: ["redis"]），单实例部署完全不受影响。
  # 开启方式：docker compose --profile redis up -d --build
  # 开启后在 .env 里设置 REDIS_URL=redis://redis:6379，app 会自动切到 Redis 实现；
  # REDIS_URL 未配置时一律走进程内存实现（与改造前行为一致）。
  redis:
    image: redis:7-alpine
    container_name: travel-notes-redis
    profiles: ["redis"]
    restart: unless-stopped
    # 只做限流/缓存，不做持久化：重启即清空（限流窗口/缓存丢失可接受，避免 AOF/RDB 拖慢写）
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    # 只绑回环：不对外暴露；多副本在同一台机器经 docker 网络互访
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-notes-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD:-__SET_MYSQL_ROOT_PASSWORD_IN_ENV__}@db:3306/travel_notes"
      # 与 db 相同：不再提供可直接使用的默认密钥，未配置时签名密钥是公开的占位串。
      JWT_SECRET: ${JWT_SECRET:-__SET_JWT_SECRET_IN_ENV__}
      SESSION_SECRET: ${SESSION_SECRET:-__SET_SESSION_SECRET_IN_ENV__}
      # App 端登录 Cookie 强制 SameSite=None+Secure（代码已固定），Web 端这里控制；HTTPS 部署建议 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NEXT_PUBLIC_SITE_TITLE: ${NEXT_PUBLIC_SITE_TITLE:-甜途}
      # P2-30 OTA：APK 完整性/灰度/强制更新（发版脚本写入 .env，环境变量缺失时回退代码默认值）
      APP_APK_SHA256: ${APP_APK_SHA256:-}
      APP_APK_SIZE: ${APP_APK_SIZE:-0}
      APP_MIN_SUPPORTED_BUILD: ${APP_MIN_SUPPORTED_BUILD:-0}
      APP_ROLLOUT_PERCENT: ${APP_ROLLOUT_PERCENT:-100}
      APP_FORCE_UPDATE: ${APP_FORCE_UPDATE:-0}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      # 敏感配置(AES-256-GCM)解密主密钥, 仅服务端读取, 不进代码
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # OTA 版本（/api/version 供 App 检查更新；默认值由 scripts/bump-version.cjs 同步，
      # verify-version.cjs 会校验它和 package.json 一致，避免漏配 .env 时下发 1.0.0 触发误强更）
      APP_VERSION: ${APP_VERSION:-1.27.0}
      APP_BUILD_NUMBER: ${APP_BUILD_NUMBER:-58}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-https://travel-notes.yuanabd.cn/downloads/tiantu.apk}
      # 更新弹窗文案（app/api/version/route.ts 支持 APP_CHANGELOG 覆盖）。
      # 此前 compose 没转发这个变量 → 每次改文案都被迫改代码、重新构建镜像。
      APP_CHANGELOG: ${APP_CHANGELOG:-}
      # ===== 多副本准备（默认空 = 纯内存，与改造前完全一致）=====
      # 配置后限流/缓存切到 Redis（docker compose --profile redis up -d，再设
      # REDIS_URL=redis://redis:6379）；连接失败/超时 500ms 自动降级内存并告警一次。
      REDIS_URL: ${REDIS_URL:-}
      # 媒体分片/转码临时目录根（默认 os.tmpdir()）。多副本时指向共享卷，
      # 否则「init 在副本 A、chunk 落到副本 B」会找不到会话目录。
      MEDIA_TMP_DIR: ${MEDIA_TMP_DIR:-}
    ports:
      # 只绑本机回环：Nginx 在同一台机器反代，无需把 3000 暴露到公网。
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # 媒体存储已迁移至 COS 存储桶（cosfs 挂载于宿主机 /data）。
      # 迁移日 2026-09-06：原 uploads-data 卷保留未删作为回滚备份（/var/lib/docker/volumes/travel-notes_uploads-data）。
      # 容器以 node(1000:1000) 运行：宿主机目录需 chown 1000:1000，见 docs/DEPLOYMENT.md。
      - /data/travel-notes/uploads:/app/public/uploads
      # ffmpeg：宿主机静态二进制只读挂载（视频转码管线；镜像内不走 apt，5M 带宽拉不动 400MB 依赖）。
      # 缺失时转码模块自动降级跳过。二进制来源 @ffmpeg-installer/linux-x64（静态链接，glibc 兼容）。
      - /usr/local/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
      # ===== 多副本：媒体分片/转码临时目录共享卷（默认不启用）=====
      # 单副本默认用 os.tmpdir()（容器内 /tmp），最快也最简单，无需任何挂载。
      # 多副本**必须**让所有副本看到同一个 MEDIA_TMP_DIR，否则「init 在副本 A、chunk 落到副本 B」
      # 会找不到会话目录（表现为上传一直重传/404）。
      # 启用步骤：
      #   1) 宿主机建目录并 chown 1000:1000（容器以 node 用户运行）：
      #        sudo mkdir -p /data/travel-notes/media-tmp && sudo chown -R 1000:1000 /data/travel-notes/media-tmp
      #   2) 取消下面这行注释（挂载到容器内 /app/media-tmp）；
      #   3) 在 .env 设 MEDIA_TMP_DIR=/app/media-tmp（不要把 MEDIA_TMP_DIR 指到 public/uploads 或 COSFS 根：
      #      分片是瞬态数据，COSFS 的 unlink/rmdir 有最终一致性延迟，建议本地盘或 NFS/EFS）。
      # - /data/travel-notes/media-tmp:/app/media-tmp
    healthcheck:
      # 镜像里没有 curl（node:22-bookworm-slim），用 node 自带的 fetch
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql-data:
